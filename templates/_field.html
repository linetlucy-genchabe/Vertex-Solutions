<div class="field{% if field.field.widget.input_type == 'checkbox' %} check{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label>{{ field }} {{ field.label }}</label>
  {% elif field.field.widget.input_type == 'radio' %}
    <label>{{ field.label }}</label>
    <div class="choices">{% for r in field %}<label>{{ r.tag }} {{ r.choice_label }}</label>{% endfor %}</div>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
  {% endif %}
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  {% for e in field.errors %}<div class="err">{{ e }}</div>{% endfor %}
</div>
